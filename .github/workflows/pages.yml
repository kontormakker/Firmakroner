name: Test and deploy FirmaKroner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run calculator tests
        run: |
          node test.js
          node vat-choice-test.js
          node faktura-buffer-test.js
          node startup-expense-test.js

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html firmakoeb.html momsregistrering-under-50000.html faktura-buffer.html udgifter-foer-opstart.html om.html privatliv.html affiliate.html robots.txt sitemap.xml cc4bb9dc90e3aa702484656973b7baf2.txt _site/

      - name: Browser smoke tests
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/firmakroner-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done

          for path in / /firmakoeb.html /momsregistrering-under-50000.html /faktura-buffer.html /udgifter-foer-opstart.html /om.html /privatliv.html /affiliate.html; do
            curl -fsS "http://127.0.0.1:4173${path}" >/dev/null
          done
          curl -fsS http://127.0.0.1:4173/cc4bb9dc90e3aa702484656973b7baf2.txt | grep -q 'cc4bb9dc90e3aa702484656973b7baf2'
          curl -fsS http://127.0.0.1:4173/robots.txt | grep -q 'sitemap.xml'
          curl -fsS http://127.0.0.1:4173/sitemap.xml | grep -q 'udgifter-foer-opstart.html'

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          FLAGS='--headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run --no-default-browser-check --virtual-time-budget=2200'

          "$CHROME" $FLAGS --dump-dom 'http://127.0.0.1:4173/' > /tmp/portal.html
          grep -q 'Små virksomhedstal i almindelige kroner' /tmp/portal.html
          grep -q 'firmakoeb.html' /tmp/portal.html
          grep -q 'momsregistrering-under-50000.html' /tmp/portal.html
          grep -q 'faktura-buffer.html' /tmp/portal.html
          grep -q 'udgifter-foer-opstart.html' /tmp/portal.html
          echo 'portal smoke ok'

          "$CHROME" $FLAGS --dump-dom 'http://127.0.0.1:4173/firmakoeb.html' > /tmp/purchase.html
          grep -q '4.800' /tmp/purchase.html
          grep -q '8.000' /tmp/purchase.html
          echo 'firm purchase smoke ok'

          "$CHROME" $FLAGS --dump-dom 'http://127.0.0.1:4173/?p=10000&v=25&vr=1&vd=100&td=75&tr=40&t=asset&d=25' > /tmp/legacy-share.html
          grep -q 'Skatteestimat sat på pause' /tmp/legacy-share.html
          echo 'legacy share redirect smoke ok'

          "$CHROME" $FLAGS --dump-dom 'http://127.0.0.1:4173/firmakoeb.html?p=50000&v=25&vr=1&vd=100&td=100&tr=40&t=asset&d=25' > /tmp/large.html
          grep -q 'Første års afskrivning i estimat' /tmp/large.html
          grep -q '36.000 kr.-grænsen' /tmp/large.html
          echo 'large-asset smoke ok'

          "$CHROME" $FLAGS --dump-dom 'http://127.0.0.1:4173/momsregistrering-under-50000.html' > /tmp/vat-choice.html
          grep -q '4.000' /tmp/vat-choice.html
          grep -q 'økonomisk dårligere' /tmp/vat-choice.html
          grep -q 'mindst 2 kalenderår' /tmp/vat-choice.html
          echo 'VAT-choice smoke ok'

          "$CHROME" $FLAGS --dump-dom 'http://127.0.0.1:4173/faktura-buffer.html' > /tmp/invoice-buffer.html
          grep -q '4.200' /tmp/invoice-buffer.html
          grep -q '2.500' /tmp/invoice-buffer.html
          grep -q 'Du vælger selv skattebufferen' /tmp/invoice-buffer.html
          echo 'invoice-buffer smoke ok'

          "$CHROME" $FLAGS --dump-dom 'http://127.0.0.1:4173/udgifter-foer-opstart.html' > /tmp/startup-default.html
          grep -q 'Muligt · skal vurderes' /tmp/startup-default.html
          grep -q '6 måneder er ikke en automatisk godkendelse' /tmp/startup-default.html
          "$CHROME" $FLAGS --dump-dom 'http://127.0.0.1:4173/udgifter-foer-opstart.html?m=3&t=establishment&u=business&d=1' > /tmp/startup-establishment.html
          grep -q 'Typisk nej' /tmp/startup-establishment.html
          grep -q 'Det ligner en etableringsudgift' /tmp/startup-establishment.html
          "$CHROME" $FLAGS --dump-dom 'http://127.0.0.1:4173/udgifter-foer-opstart.html?m=7&t=operating&u=business&d=1' > /tmp/startup-old.html
          grep -q 'Svagere signal' /tmp/startup-old.html
          echo 'startup-expense smoke ok'

          "$CHROME" $FLAGS --dump-dom 'http://127.0.0.1:4173/affiliate.html' > /tmp/affiliate.html
          grep -q 'endnu ingen aktive affiliate-links' /tmp/affiliate.html
          grep -q 'Beregninger påvirkes aldrig' /tmp/affiliate.html
          echo 'disclosure smoke ok'

          "$CHROME" $FLAGS --window-size=390,844 --screenshot=/tmp/mobile-portal.png 'http://127.0.0.1:4173/'
          test -s /tmp/mobile-portal.png
          "$CHROME" $FLAGS --window-size=390,844 --screenshot=/tmp/mobile-purchase.png 'http://127.0.0.1:4173/firmakoeb.html'
          test -s /tmp/mobile-purchase.png
          "$CHROME" $FLAGS --window-size=390,844 --screenshot=/tmp/mobile-vat.png 'http://127.0.0.1:4173/momsregistrering-under-50000.html'
          test -s /tmp/mobile-vat.png
          "$CHROME" $FLAGS --window-size=390,844 --screenshot=/tmp/mobile-buffer.png 'http://127.0.0.1:4173/faktura-buffer.html'
          test -s /tmp/mobile-buffer.png
          "$CHROME" $FLAGS --window-size=390,844 --screenshot=/tmp/mobile-startup.png 'http://127.0.0.1:4173/udgifter-foer-opstart.html'
          test -s /tmp/mobile-startup.png
          echo 'mobile screenshots ok'

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-indexnow:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Notify IndexNow after successful deploy
        run: |
          KEY='cc4bb9dc90e3aa702484656973b7baf2'
          KEY_LOCATION="https://kontormakker.github.io/Firmakroner/${KEY}.txt"
          curl --retry 6 --retry-delay 2 --retry-all-errors -fsS "$KEY_LOCATION" | grep -q "$KEY"
          cat > /tmp/indexnow.json <<EOF
          {
            "host": "kontormakker.github.io",
            "key": "$KEY",
            "keyLocation": "$KEY_LOCATION",
            "urlList": [
              "https://kontormakker.github.io/Firmakroner/",
              "https://kontormakker.github.io/Firmakroner/firmakoeb.html",
              "https://kontormakker.github.io/Firmakroner/momsregistrering-under-50000.html",
              "https://kontormakker.github.io/Firmakroner/faktura-buffer.html",
              "https://kontormakker.github.io/Firmakroner/udgifter-foer-opstart.html",
              "https://kontormakker.github.io/Firmakroner/om.html",
              "https://kontormakker.github.io/Firmakroner/privatliv.html",
              "https://kontormakker.github.io/Firmakroner/affiliate.html"
            ]
          }
          EOF
          STATUS=$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' -H 'Content-Type: application/json; charset=utf-8' --data-binary @/tmp/indexnow.json https://api.indexnow.org/indexnow)
          echo "IndexNow HTTP $STATUS"
          if [ "$STATUS" != '200' ] && [ "$STATUS" != '202' ]; then
            cat /tmp/indexnow-response.txt || true
            exit 1
          fi
