name: Test and deploy FirmaKroner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run calculator tests
        run: |
          node test.js
          for test_file in *-test.js; do
            echo "Running ${test_file}"
            node "${test_file}"
          done

      - name: Prepare static site
        run: |
          mkdir -p _site
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*-lib.js' -o -name 'robots.txt' -o -name 'sitemap.xml' -o -name 'cc*.txt' \) -exec cp {} _site/ \;
          test -f _site/index.html
          test -f _site/sitemap.xml

      - name: Browser smoke tests
        run: bash browser-smoke.sh

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-indexnow:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify public sitemap after successful deploy
        run: |
          SITEMAP='https://kontormakker.github.io/Firmakroner/sitemap.xml'
          OK=0
          for i in {1..12}; do
            if curl --retry 2 --retry-delay 1 --retry-all-errors -fsS "${SITEMAP}?deploy=${GITHUB_SHA}" -o /tmp/public-sitemap.xml; then
              if python3 -c "import xml.etree.ElementTree as ET; ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}; r=ET.parse('/tmp/public-sitemap.xml').getroot(); u=[n.text for n in r.findall('.//s:loc',ns) if n.text]; assert len(u)==21, len(u); assert 'https://kontormakker.github.io/Firmakroner/' in u; assert 'https://kontormakker.github.io/Firmakroner/pmv-eller-enkeltmandsvirksomhed.html' in u; assert 'https://kontormakker.github.io/Firmakroner/skjul-hjemmeadresse-cvr.html' in u; print('public sitemap OK:',len(u),'URLs')"; then
                OK=1
                break
              fi
            fi
            echo "Public sitemap not updated yet; retry ${i}/12"
            sleep 5
          done
          test "$OK" = '1'

      - name: Verify every public page after deploy
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import html
          import os
          import time
          import urllib.request
          import xml.etree.ElementTree as ET

          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root=ET.parse('/tmp/public-sitemap.xml').getroot()
          urls=[node.text for node in root.findall('.//s:loc',ns) if node.text]
          assert len(urls)==21, len(urls)
          sha=os.environ['DEPLOY_SHA']

          def fetch(url):
              sep='&' if '?' in url else '?'
              request=urllib.request.Request(f'{url}{sep}deploy={sha}',headers={'User-Agent':'FirmaKroner-release-gate/1.0'})
              last=None
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(request,timeout=20) as response:
                          assert response.status==200, (url,response.status)
                          return response.read().decode('utf-8','replace')
                  except Exception as exc:
                      last=exc
                      if attempt<4: time.sleep(2+attempt)
              raise last

          for url in urls:
              body=fetch(url)
              canonical=f'rel="canonical" href="{html.escape(url,quote=True)}"'
              canonical_single=f"rel='canonical' href='{html.escape(url,quote=True)}'"
              assert canonical in body or canonical_single in body, f'{url}: canonical missing on live page'
              assert '<title>' in body.lower(), f'{url}: title missing on live page'

          home=fetch('https://kontormakker.github.io/Firmakroner/')
          assert 'google-site-verification' in home, 'Search Console verification missing from live homepage'
          digital=fetch('https://kontormakker.github.io/Firmakroner/skal-jeg-bogfoere-digitalt-2026.html')
          assert 'Reklame · reklamelink for Dinero' in digital, 'Dinero disclosure missing live'
          assert 'affiliateConsent' in digital and 'data-affiliate-url' in digital, 'affiliate consent gate missing live'
          cvr=fetch('https://kontormakker.github.io/Firmakroner/skjul-hjemmeadresse-cvr.html')
          assert 'virksomhedsadresser altid skal offentliggøres' in cvr, 'CVR publication guard missing live'
          print(f'live-page-gate: {len(urls)} sitemap pages returned 200 with canonical; critical markers present')
          PY

      - name: Notify IndexNow after successful deploy
        run: |
          KEY='cc4bb9dc90e3aa702484656973b7baf2'
          KEY_LOCATION="https://kontormakker.github.io/Firmakroner/${KEY}.txt"
          curl --retry 6 --retry-delay 2 --retry-all-errors -fsS "$KEY_LOCATION" | grep -q "$KEY"
          python3 - <<'PY' > /tmp/indexnow.json
          import json, xml.etree.ElementTree as ET
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root=ET.parse('sitemap.xml').getroot()
          urls=[node.text for node in root.findall('.//s:loc',ns) if node.text]
          print(json.dumps({
              'host':'kontormakker.github.io',
              'key':'cc4bb9dc90e3aa702484656973b7baf2',
              'keyLocation':'https://kontormakker.github.io/Firmakroner/cc4bb9dc90e3aa702484656973b7baf2.txt',
              'urlList':urls
          }))
          PY
          STATUS=$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' -H 'Content-Type: application/json; charset=utf-8' --data-binary @/tmp/indexnow.json https://api.indexnow.org/indexnow)
          echo "IndexNow HTTP $STATUS"
          if [ "$STATUS" != '200' ] && [ "$STATUS" != '202' ]; then
            cat /tmp/indexnow-response.txt || true
            exit 1
          fi
